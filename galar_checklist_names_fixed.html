<script>
(function(){
const boxes=[...document.querySelectorAll('.item')], count=document.getElementById('count'), search=document.getElementById('search');
function update(){let n=0; boxes.forEach((item,i)=>{const cb=item.querySelector('input');try{cb.checked=localStorage.getItem('galar_no_'+(i+1))==='true'}catch(e){} item.classList.toggle('checked',cb.checked);if(cb.checked)n++});count.textContent=n}
boxes.forEach((item,i)=>{const cb=item.querySelector('input');cb.addEventListener('change',()=>{item.classList.toggle('checked',cb.checked);try{localStorage.setItem('galar_no_'+(i+1),String(cb.checked))}catch(e){};count.textContent=boxes.filter(x=>x.querySelector('input').checked).length})});
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();boxes.forEach(item=>{const text=item.textContent.toLowerCase()+' '+item.dataset.no;item.classList.toggle('hidden',!text.includes(q))})});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('チェックをすべて解除しますか？')){boxes.forEach((item,i)=>{const cb=item.querySelector('input');cb.checked=false;item.classList.remove('checked');try{localStorage.removeItem('galar_no_'+(i+1))}catch(e){}});count.textContent='0'}});
update();
})();
</script></body></html>
